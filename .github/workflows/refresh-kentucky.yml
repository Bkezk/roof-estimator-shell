# Monthly refresh of the prospecting data from Kentucky's free GIS (docs/roofing-ops-portal-brief.md).
# Footprints are a one-time survey, so the monthly run refreshes addresses, named businesses and
# facilities; run it by hand with "Load footprints too" for the first statewide load or when the
# state republishes footprints. Secrets (repository settings → Secrets and variables → Actions):
# LOADER_EMAIL and LOADER_PASSWORD, a Bid-O-Matic login with Prospecting access made in Users &
# access. The project URL and public key come from the committed .env.
name: Refresh Kentucky data

on:
  schedule:
    - cron: "0 7 1 * *" # 07:00 UTC on the 1st = 3 am Eastern
  workflow_dispatch:
    inputs:
      county:
        description: "One county (blank = all 120)"
        required: false
        default: ""
      footprints:
        description: "Load footprints too (first load / new survey)"
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # One run at a time: the database is a small instance with a burst disk-IO budget and
        # two or three parallel loaders starved it (runs 5–7). Matching now happens in the
        # loader's memory, so one shard finishes the state in a few hours. To parallelise
        # again, list more shards here; each takes every n-th county.
        shard: [1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Load
        env:
          LOADER_EMAIL: ${{ secrets.LOADER_EMAIL }}
          LOADER_PASSWORD: ${{ secrets.LOADER_PASSWORD }}
          COUNTY: ${{ github.event.inputs.county }}
          FOOTPRINTS: ${{ github.event.inputs.footprints }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$COUNTY" ]; then
            if [ "$SHARD" != "1" ]; then echo "single county: shard $SHARD has nothing to do"; exit 0; fi
            ARGS="--county $COUNTY"
          else
            ARGS="--all --shard $SHARD/1"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$FOOTPRINTS" != "true" ]; then ARGS="$ARGS --skip-footprints"; fi
          echo "running: $ARGS"
          npx vite-node scripts/load-kentucky.ts $ARGS
