# Monthly refresh of the prospecting data from Kentucky's free GIS (docs/roofing-ops-portal-brief.md).
# Footprints are a one-time survey, so the monthly run refreshes addresses, named businesses and
# facilities; run it by hand with "Load footprints too" for the first statewide load or when the
# state republishes footprints. Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (repository
# settings → Secrets and variables → Actions).
name: Refresh Kentucky data

on:
  schedule:
    - cron: "0 7 1 * *" # 07:00 UTC on the 1st = 3 am Eastern
  workflow_dispatch:
    inputs:
      county:
        description: "One county (blank = all 120)"
        required: false
        default: ""
      footprints:
        description: "Load footprints too (first load / new survey)"
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # Four runs in parallel, each taking every 4th county, so all 120 fit inside the
        # 6-hour job limit. A single county runs in shard 1 alone.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Load
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNTY: ${{ github.event.inputs.county }}
          FOOTPRINTS: ${{ github.event.inputs.footprints }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$COUNTY" ]; then
            if [ "$SHARD" != "1" ]; then echo "single county: shard $SHARD has nothing to do"; exit 0; fi
            ARGS="--county $COUNTY"
          else
            ARGS="--all --shard $SHARD/4"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$FOOTPRINTS" != "true" ]; then ARGS="$ARGS --skip-footprints"; fi
          echo "running: $ARGS"
          npx vite-node scripts/load-kentucky.ts $ARGS
