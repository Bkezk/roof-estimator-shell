# Fires the due follow-up reminders (email + push) by calling the app's cron endpoint. Set two
# repository secrets: APP_URL (the published app, e.g. https://bid-o-matic.lovable.app) and
# CRON_SECRET (the same value as LOVABLE_CRON_SECRET in Lovable Cloud). Without them the run
# FAILS (red, so it is noticed — audit, Oct 2: it used to exit 0 with "skipping"); the app still
# dispatches, throttled, whenever an office user opens it.
#
# Since Nov 13 this job is the BACKUP. The database keeps the time itself and calls the same
# endpoint at minutes 2 and 32 (supabase/migrations/20261113190000_reminder_timer.sql), because
# GitHub ran this job about twice a day instead of twice an hour. Two callers are safe: the
# reminder pass claims each reminder before it sends.
name: Follow-up reminders

on:
  schedule:
    # Twice an hour from 12:07 to 23:37 UTC: 8:07 AM to 7:37 PM Eastern in summer, 7:07 AM to
    # 6:37 PM Eastern in winter. Reminders are set to 8:00 AM Eastern all year (reminder_morning):
    # the first run after that is the 12:07 UTC one in summer and the 13:07 UTC one in winter.
    #
    # At minutes 7 and 37, not 0 and 30 (the Nov 13 audit): GitHub starts scheduled runs late or
    # not at all when it is busy, and the top and the half of the hour are its busiest moments.
    # On "*/30" this job ran about twice a day instead of 24 times, hours late.
    - cron: "7,37 12-23 * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL / CRON_SECRET repository secrets are not set; no reminders were sent by this run"
            exit 1
          fi
          curl -sS -f -X POST "$APP_URL/api/cron/reminders" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" | tee out.json
