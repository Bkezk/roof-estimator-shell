# Every push to main and every pull request runs the same checks a contributor runs locally.
# Lovable builds from main, so a red commit here means a broken portal for every module.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installs exactly the committed package-lock.json, so CI runs the same tree every time.
      # (bun.lock is Lovable's and was found out of sync with package.json, so bun
      # --frozen-lockfile could not be used; see docs/DECISIONS.md.)
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npm run lint
      - run: npm test
